<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="t1"><title id="t1">Simulação de financiamento: calculadora e gráfico de parcelas</title>
<defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF1FB"/><stop offset="1" stop-color="#C9D8EC"/></linearGradient></defs>
<rect width="400" height="240" fill="url(#bg1)"/>
<circle cx="330" cy="40" r="70" fill="#2F80ED" opacity=".10"/><circle cx="60" cy="210" r="60" fill="#B2915A" opacity=".14"/>
<!-- gráfico -->
<rect x="210" y="62" width="150" height="120" rx="12" fill="#fff"/>
<rect x="228" y="140" width="18" height="26" rx="3" fill="#C9D8EC"/><rect x="254" y="122" width="18" height="44" rx="3" fill="#9DB8DE"/><rect x="280" y="106" width="18" height="60" rx="3" fill="#2F80ED"/><rect x="306" y="88" width="18" height="78" rx="3" fill="#0E1A2B"/><rect x="332" y="76" width="14" height="90" rx="3" fill="#B2915A"/>
<polyline points="232,128 262,112 290,96 316,80 342,66" fill="none" stroke="#B2915A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<!-- calculadora -->
<rect x="70" y="36" width="120" height="168" rx="16" fill="#0E1A2B"/>
<rect x="84" y="52" width="92" height="34" rx="6" fill="#DDE8F6"/>
<text x="168" y="76" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#0E1A2B">R$</text>
<g fill="#2C4366"><rect x="84" y="98" width="20" height="18" rx="4"/><rect x="112" y="98" width="20" height="18" rx="4"/><rect x="140" y="98" width="20" height="18" rx="4"/><rect x="84" y="124" width="20" height="18" rx="4"/><rect x="112" y="124" width="20" height="18" rx="4"/><rect x="140" y="124" width="20" height="18" rx="4"/><rect x="84" y="150" width="20" height="18" rx="4"/><rect x="112" y="150" width="20" height="18" rx="4"/><rect x="140" y="150" width="20" height="18" rx="4"/><rect x="84" y="176" width="48" height="16" rx="4"/></g>
<rect x="166" y="98" width="12" height="44" rx="4" fill="#2F80ED"/><rect x="166" y="150" width="12" height="42" rx="4" fill="#B2915A"/><rect x="140" y="176" width="20" height="16" rx="4" fill="#2C4366"/>
<!-- moeda % -->
<circle cx="205" cy="186" r="24" fill="#B2915A"/><circle cx="205" cy="186" r="18" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/>
<text x="205" y="193" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#fff">%</text>
</svg>
